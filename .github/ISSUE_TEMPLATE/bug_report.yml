name: Bug Report
description: Report a bug in Signalstream
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the form below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to trigger the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Signalstream Version
      placeholder: "0.1.0"

  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      options:
        - pip
        - Docker
        - From source

  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "3.12.0"

  - type: dropdown
    id: llm-provider
    attributes:
      label: LLM Provider
      options:
        - Ollama
        - Claude
        - OpenAI-compatible
        - N/A

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any relevant logs (API keys will be redacted automatically).
      render: shell
