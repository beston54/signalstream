[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signalstream"
version = "0.1.0"
description = "Local-first sentiment analysis powered by LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Signalstream Contributors"},
]
keywords = ["sentiment-analysis", "llm", "nlp", "reddit", "flask"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "nh3>=0.2",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60"]
reddit-api = ["praw>=7.7"]
claude = ["anthropic>=0.39"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://github.com/signalstream/signalstream"
Documentation = "https://github.com/signalstream/signalstream#readme"
Repository = "https://github.com/signalstream/signalstream"
Issues = "https://github.com/signalstream/signalstream/issues"

[tool.setuptools.packages.find]
include = ["signalstream*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["signalstream"]

[tool.pytest.ini_options]
testpaths = ["signalstream/tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
