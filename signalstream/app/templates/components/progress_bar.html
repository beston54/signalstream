<div class="progress-display">
    <h2 id="progress-stage">Starting analysis...</h2>
    <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
    </div>
    <p id="progress-detail" class="progress-detail">
        <span id="progress-items">0</span> / <span id="progress-total">0</span> items
    </p>
    <p id="progress-message" class="progress-message"></p>
    <p id="progress-elapsed" class="progress-elapsed"></p>
    <button id="cancel-btn" class="btn btn-secondary">Cancel</button>
</div>
