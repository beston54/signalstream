<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}signalstream{% endblock %}</title>
    <meta name="description" content="Social intelligence, distilled. AI-powered sentiment analysis with ready-to-share report cards.">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230C1220'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='%234DA8FF'>S</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container nav-inner">
            <a href="{{ url_for('index') }}" class="nav-brand">
                <span>signal</span>stream
            </a>
            <div class="nav-links">
                <a href="{{ url_for('index') }}">New Analysis</a>
                <a href="{{ url_for('compare_page') }}">Compare</a>
                <a href="{{ url_for('profiles_page') }}">Profiles</a>
                <a href="{{ url_for('history') }}">History</a>
                <a href="{{ url_for('about') }}">About</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p><span>signal</span>stream &middot; Social Intelligence, Distilled.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
